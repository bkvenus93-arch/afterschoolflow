                        { period: '방과후', manager: '운영보고서(분기별)-내부결재 및 통계분석, 개인정보 파기 확인서, 연간 운영 만족도 조사 및 방과후교실 프로그램 수요 조사, 운영계획(강사 선정 계획 · 업체 선정 계획), 학운위, 교재교구 재료비 · 강사료 · 수용비(학운위), 방과후 특수 돌봄 강사 서류 취합 및 오리엔테이션, 봉사자 위촉', staff: '파일철 정리', vendor: '' }
                        { period: '돌봄', manager: '학교운영위원회 심의/ 구매계획(품의), 계약방법 결정 및 견적서 제출/업체 결격 여부 확인, 계약체결, 납품확인 및 대가지급', staff: '파일철 정리', vendor: '' }
                    ]
                },
                {
                    category: '정보공시 및 제출',
                    icon: 'fa-bullhorn',
                    tasks: [
                        { period: '2월', manager: '방과후 돌봄 참여현황 통계 자료 제출(1차-2월), 정보공시 자료 입력 및 통계자료 제출(5월)', staff: '교데통 제출(2월)', vendor: '' }
                        { period: '3월', manager: '맞춤형교실 예산 신청(추가-3월)', staff: '', vendor: '' }
                        { period: '5월', manager: '정보공시 자료 입력 및 통계자료 제출(5월)', staff: '', vendor: '' }

                    ]
                },
                {
                    category: '특수방과후&돌봄',
                    icon: 'fa-bullhorn',
                    tasks: [
                        { period: '2월', manager: '방과후 돌봄 참여현황 통계 자료 제출(1차-2월), 정보공시 자료 입력 및 통계자료 제출(5월)', staff: '교데통 제출(2월)', vendor: '' }
                        { period: '3월', manager: '맞춤형교실 예산 신청(추가-3월)', staff: '', vendor: '' }
                        { period: '5월', manager: '정보공시 자료 입력 및 통계자료 제출(5월)', staff: '', vendor: '' }

                    ]
                }
            ];

            let currentCategoryIndex = 0;

            const sidebarNav = document.getElementById('sidebar-nav');
            const titleEl = document.getElementById('current-category-title');
            const tableBody = document.getElementById('table-body');
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');

            mobileMenuBtn.addEventListener('click', () => {
                sidebarNav.classList.toggle('hidden');
            });

            function formatCellContent(text) {
                if (!text || text.trim() === '') {
                    return '<span class="text-gray-300 italic">-</span>';
                }
                
                let cleanText = text.replace(/\d+\)\s*/g, '');
                let items = cleanText.split(/,\s*/);
                
                let html = '';
                items.forEach(item => {
                    let trimmedItem = item.trim();
                    if (trimmedItem) {
                        html += `<div class="task-box">${trimmedItem}</div>`;
                    }
                });
                return html;
            }

            function renderSidebar() {
                sidebarNav.innerHTML = '';
                workflowData.forEach((item, index) => {
                    const btn = document.createElement('button');
                    const isActive = index === currentCategoryIndex;
                    
                    btn.className = `w-full text-left px-4 py-3 rounded-lg mb-1 transition-colors duration-200 flex items-center gap-3 ${
                        isActive 
                        ? 'bg-emerald-100 text-emerald-900 font-semibold shadow-sm' 
                        : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'
                    }`;
                    
                    btn.innerHTML = `
                        <i class="fa-solid ${item.icon} w-5 text-center ${isActive ? 'text-emerald-700' : 'text-gray-400'}"></i>
                        <span class="truncate">${item.category}</span>
                    `;
                    
                    btn.onclick = () => {
                        currentCategoryIndex = index;
                        renderSidebar();
                        renderContent();
                        if (window.innerWidth < 768) {
                            sidebarNav.classList.add('hidden');
                        }
                    };
                    sidebarNav.appendChild(btn);
                });
            }

            function renderContent() {
                const data = workflowData[currentCategoryIndex];
                
                titleEl.innerHTML = `<i class="fa-solid ${data.icon} text-emerald-400"></i> ${data.category}`;
                tableBody.innerHTML = '';
                
                if (data.tasks.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-gray-500">등록된 업무가 없습니다.</td></tr>`;
                    return;
                }

                data.tasks.forEach((task) => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors duration-150 group';
                    
                    tr.innerHTML = `
                        <td class="p-4 align-top border-b border-gray-100 bg-gray-50/50 group-hover:bg-gray-100/50 text-center font-medium text-gray-700 whitespace-nowrap">
                            ${task.period}
                        </td>
                        <td class="p-4 align-top border-b border-gray-100 bg-green-50/30">
                            ${formatCellContent(task.manager)}
                        </td>
                        <td class="p-4 align-top border-b border-gray-100 bg-teal-50/20">
                            ${formatCellContent(task.staff)}
                        </td>
                        <td class="p-4 align-top border-b border-gray-100 bg-white">
                            ${formatCellContent(task.vendor)}
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });
            }

            renderSidebar();
            renderContent();

            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    sidebarNav.classList.remove('hidden');
                } else {
                    sidebarNav.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
