<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방과후 다이어리 - 업무 흐름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e7decd;
  --paper:#fcfaf5;
  --ink:#2b2926;
  --muted:#9a9284;
  --line:#ddd4c3;

  --pink:#f7d9df;   --pink-d:#f1bcc8;  --pink-dot:#d8708a;
  --blue:#dbe9f6;   --blue-d:#bad5ec;  --blue-dot:#4d84b8;
  --yellow:#fbf0c9; --yellow-d:#f4dd96; --yellow-dot:#c29a1c;
  --mint:#d9efe3;   --lavender:#e6dff3; --peach:#fbe4d3; --gray:#e4e0da; --green:#e1efd3;

  --hand:'Gaegu','Gowun Dodum','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --body:'Gowun Dodum','Pretendard','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--desk)}
body{
  font-family:var(--body);color:var(--ink);min-height:100vh;
  background:
    repeating-linear-gradient(90deg,rgba(120,100,70,.045) 0 2px,transparent 2px 7px),
    var(--desk);
  padding:18px 24px 40px;
}
.wrap{max-width:1360px;margin:0 auto}
button,input{font-family:inherit;color:inherit}

/* ---------- 상단 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:10px;background:var(--green);border:2px solid #fff;display:grid;place-items:center;font-size:26px}
.brand h1{font-family:var(--hand);font-size:34px;font-weight:700;letter-spacing:.5px;line-height:1}
.brand small{display:block;font-family:var(--serif);font-style:italic;font-size:12px;color:var(--muted);letter-spacing:2px;margin-top:3px}
.search{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--line);padding:6px 4px;min-width:260px;background:transparent}
.search input{border:0;outline:0;background:transparent;font-size:15px;width:100%;font-family:var(--hand);font-size:18px}
.search input::placeholder{color:var(--muted)}
.search:focus-within{border-color:var(--ink)}

/* ---------- 상단 메뉴 (아이콘 + 마스킹테이프) ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:10px 8px;padding:6px 2px 4px;margin-bottom:22px}
.tab{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px 9px 11px;border:0;cursor:pointer;
  font-family:var(--hand);font-size:19px;font-weight:700;line-height:1;
  background:var(--c,var(--gray));border-radius:3px;
  transform:rotate(var(--r,0deg));
  transition:transform .15s;
  position:relative;
}
.tab .ic{font-size:20px;line-height:1}
.tab:hover{transform:translateY(-2px) rotate(0deg)}
.tab[aria-current="true"]{background:var(--ink);color:#fff;transform:none;border-radius:8px}
.tab:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}

/* ---------- 본문 카드 ---------- */
.card{position:relative;background:var(--paper);border-radius:10px;box-shadow:0 1px 3px rgba(90,70,40,.12);padding:34px 36px 40px}
.card::before{
  content:"";position:absolute;top:-14px;left:50%;width:160px;height:28px;margin-left:-80px;
  background:rgba(170,205,230,.65);transform:rotate(-1.2deg);
}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:12px}
.title-block{display:flex;align-items:flex-end;gap:18px}
.num{font-family:var(--serif);font-size:76px;line-height:.85;font-weight:400}
.ttl h2{font-family:var(--hand);font-size:32px;font-weight:700;line-height:1.15}
.ttl p{font-size:12px;letter-spacing:3px;color:var(--muted);margin-top:6px;text-transform:uppercase;font-family:var(--serif)}
.nav{display:flex;gap:8px}
.nav button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:20px;cursor:pointer;line-height:1}
.nav button:hover{border-color:var(--ink)}
.nav button:disabled{opacity:.35;cursor:default}
.nav .count{align-self:center;font-family:var(--serif);font-size:13px;letter-spacing:2px;color:var(--muted);margin-right:6px}

/* ---------- 표 ---------- */
table{width:100%;border-collapse:separate;border-spacing:8px;table-layout:fixed}
col.p{width:130px}
thead th{padding:0;text-align:left;font-weight:400}
.tape{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 12px;border-radius:3px;font-family:var(--hand);font-size:21px;font-weight:700;
}
.tape.mgr{background:var(--pink-d)}
.tape.staff{background:var(--blue-d)}
.tape.vendor{background:var(--yellow-d)}
.tape.per{background:transparent;color:var(--muted);font-size:16px;letter-spacing:2px}
td{vertical-align:top;padding:0}
td.period{padding-top:6px}
.plabel{
  display:inline-block;max-width:100%;padding:7px 11px;background:var(--lavender);border-radius:3px;
  font-family:var(--hand);font-size:19px;font-weight:700;line-height:1.25;word-break:keep-all;
}
td.c{border-radius:8px;padding:10px 16px}
td.c.mgr{background:var(--pink)}
td.c.staff{background:var(--blue)}
td.c.vendor{background:var(--yellow)}
td.empty{background:transparent}            /* 업무 없는 칸: 아무것도 표시하지 않음 */
.item{position:relative;padding:7px 0 7px 14px;font-size:14px;line-height:1.55;word-break:keep-all;border-bottom:1px dashed rgba(60,50,30,.16)}
.item:last-child{border-bottom:0}
.item::before{content:"";position:absolute;left:0;top:15px;width:6px;height:6px;border-radius:50%;background:var(--dot)}
.mgr .item{--dot:var(--pink-dot)}
.staff .item{--dot:var(--blue-dot)}
.vendor .item{--dot:var(--yellow-dot)}
mark{background:#fff08a;padding:0 2px;border-radius:2px}
tr.catrow td{padding:18px 0 2px;font-family:var(--hand);font-size:24px;font-weight:700}
tr.catrow td span{display:inline-block;padding:4px 12px;background:var(--mint);border-radius:3px}
.none{padding:46px 6px;font-family:var(--hand);font-size:22px;color:var(--muted)}

/* ---------- 모바일 ---------- */
@media (max-width:860px){
  body{padding:12px 12px 30px}
  .card{padding:26px 16px 28px}
  .num{font-size:54px}
  .ttl h2{font-size:26px}
  .search{min-width:0;width:100%}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:10px}
  .tab{flex:0 0 auto}
  table,tbody,tr,td{display:block}
  thead,colgroup{display:none}
  table{border-spacing:0}
  tr{margin-bottom:16px}
  td.c{margin-top:6px;padding-top:30px;position:relative}
  td.c::before{
    content:attr(data-label);position:absolute;top:6px;left:12px;
    font-family:var(--hand);font-size:16px;font-weight:700;
  }
  td.empty{display:none}
  td.period{padding:0}
}

/* ---------- 인쇄 ---------- */
@media print{
  html,body{background:#fff}
  .tabs,.search,.nav,.card::before{display:none}
  .card{box-shadow:none;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">

  </main>
</div>

const palette = ['--gray','--blue','--mint','--lavender','--pink','--yellow','--peach','--green'];
const tilt = [-.8,.6,-.4,.8,-.6,.4];

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

/* 괄호 안의 쉼표는 자르지 않고, 괄호 밖의 쉼표에서만 항목을 나눈다 */
function splitItems(text){
  if(!text) return [];
  const out = []; let cur = '', depth = 0;
  for(const ch of text){
    if(ch === '(') depth++;
    else if(ch === ')') depth = Math.max(0, depth-1);
    if(ch === ',' && depth === 0){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}

function hl(s, q){
  const e = esc(s);
  if(!q) return e;
  const re = new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return e.replace(re, m => '<mark>' + m + '</mark>');
}

function cell(text, cls, label, q){
  const items = splitItems(text);
  if(!items.length) return '<td class="empty"></td>';
  return '<td class="c ' + cls + '" data-label="' + label + '">' +
    items.map(i => '<div class="item">' + hl(i, q) + '</div>').join('') + '</td>';
}

function rowHtml(r, q){
  return '<tr><td class="period"><span class="plabel">' + hl(r[0], q) + '</span></td>' +
    cell(r[1],'mgr','실장',q) + cell(r[2],'staff','실무사',q) + cell(r[3],'vendor','업체코디',q) + '</tr>';
}

let cur = 0;

function renderTabs(){
  const nav = $('tabs');
  nav.innerHTML = '';
  data.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.style.setProperty('--c', 'var(' + palette[i % palette.length] + ')');
    b.style.setProperty('--r', tilt[i % tilt.length] + 'deg');
    if(i === cur && !$('q').value.trim()) b.setAttribute('aria-current','true');
    b.innerHTML = '<span class="ic" aria-hidden="true">' + d.icon + '</span><span>' + esc(d.tab) + '</span>';
    b.onclick = () => { $('q').value = ''; go(i); };
    nav.appendChild(b);
  });
}

function render(){
  const q = $('q').value.trim();
  const body = $('body'), none = $('none');
  renderTabs();

  if(q){
    const lq = q.toLowerCase();
    let html = '', hits = 0;
    data.forEach(d => {
      const rows = d.rows.filter(r => r.some(t => t.toLowerCase().includes(lq)));
      if(!rows.length) return;
      hits += rows.length;
      html += '<tr class="catrow"><td colspan="4"><span>' + d.icon + ' ' + esc(d.title) + '</span></td></tr>';
      html += rows.map(r => rowHtml(r, q)).join('');
    });
    $('num').textContent = hits;
    $('ttl').textContent = '검색 결과';
    $('sub').textContent = '“' + q + '”';
    $('count').textContent = '';
    $('prev').hidden = $('next').hidden = true;
    body.innerHTML = html;
    none.hidden = hits > 0;
    none.textContent = '일치하는 업무가 없어요';
    return;
  }

  const d = data[cur];
  $('num').textContent = pad(cur+1);
  $('ttl').textContent = d.title;
  $('sub').textContent = d.en;
  $('count').textContent = pad(cur+1) + ' / ' + pad(data.length);
  $('prev').hidden = $('next').hidden = false;
  $('prev').disabled = cur === 0;
  $('next').disabled = cur === data.length - 1;
  body.innerHTML = d.rows.map(r => rowHtml(r, '')).join('');
  none.hidden = d.rows.length > 0;
  none.textContent = '아직 적은 일이 없어요';
}

function go(i){
  cur = Math.max(0, Math.min(data.length-1, i));
  history.replaceState(null, '', '#' + (cur+1));
  render();
}

$('prev').onclick = () => go(cur-1);
$('next').onclick = () => go(cur+1);
$('q').addEventListener('input', render);
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowLeft') go(cur-1);
  if(e.key === 'ArrowRight') go(cur+1);
});
window.addEventListener('hashchange', () => {
  const n = parseInt(location.hash.slice(1), 10);
  if(n >= 1 && n <= data.length && n-1 !== cur){ cur = n-1; render(); }
});

const start = parseInt(location.hash.slice(1), 10);
if(start >= 1 && start <= data.length) cur = start-1;
render();
</script>
